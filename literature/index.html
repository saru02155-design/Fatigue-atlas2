<script id="bibliographyData" type="application/json">[{"title":"オンラインMBSRの精神疲労","doi":"10.1080/02699052.2024.2347545","pmid":"38676709","url":"https://pubmed.ncbi.nlm.nih.gov/38676709/","easy":"後天性脳損傷後の精神疲労に対するオンラインMBSRでは、待機群より疲労が改善したとは確認できませんでした。受講を完了した人だけの前後改善は、比較試験の効果とは区別します。","standard":"60人を無作為化した自習型オンラインMBSR研究。反復測定解析で疲労の群間差は非有意でした。受講完遂16人の群内変化はp=.003でしたが、完遂者に限定した解析であり、対照群への優越性を示しません。","research":"後天性脳損傷後の精神疲労。無作為化n=60、受講完遂16人。反復測定ANOVAの群間差は非有意。完遂者群内p=.003、d=.896。欠測/離脱、ITTと有害事象・PEMの詳細は未確認。群内効果量を群間効果量として採用しない。","score":0,"certainty":"D","related":[{"id":"mbsr","name":"マインドフルネス（MBSR）"}],"population":"後天性脳損傷後の持続する精神疲労","outcome":"実施可能性・精神疲労質問票","linked_intervention_identified":false},{"title":"モダフィニル補助 vs 偽薬","doi":"10.1176/appi.ajp.2007.06060981","pmid":"17671288","url":"https://pubmed.ncbi.nlm.nih.gov/17671288/","easy":"双極性うつへのモダフィニル追加は抑うつ症状の改善を報告しましたが、疲労特異的な群間効果は確認できていません。","standard":"双極性うつへのモダフィニル追加は抑うつ症状の改善を報告しましたが、疲労特異的な群間効果は確認できていません。\n\n対象：双極性うつ。人数：85 (41/44)。デザイン・比較：6週二重盲検プラセボ対照・気分安定薬±抗うつ薬にモダフィニル100–200mg/日追加（平均177mg/日）。実施条件：6週二重盲検プラセボ対照・気分安定薬±抗うつ薬にモダフィニル100–200mg/日追加（平均177mg/日）。\n主要・副次の区別：IDS臨床家評価抑うつ重症度変化。\n結果（出典の記載）：抑うつ反応44%対23%、寛解39%対18%。疲労特異的効果は不明。\n解釈上の限界：疲労を対象とするアトラスで有効性判定する群間疲労尺度が一次抄録にない。抑うつ改善を代用しない。","research":"対象・試験設計：対象：双極性うつ。人数：85 (41/44)。デザイン・比較：6週二重盲検プラセボ対照・気分安定薬±抗うつ薬にモダフィニル100–200mg/日追加（平均177mg/日）。実施条件：6週二重盲検プラセボ対照・気分安定薬±抗うつ薬にモダフィニル100–200mg/日追加（平均177mg/日）。\n評価項目の位置づけ：IDS臨床家評価抑うつ重症度変化。\n疲労尺度・方向性：疲労尺度の群間差は抄録に記載なし。\n報告された比較結果（報告値）：抑うつ反応44%対23%、寛解39%対18%。疲労特異的効果は不明。\n有害事象・PEM・脱落：躁/軽躁6/41対5/44、躁病入院各1; PEM specific monitoring 未確認。\n方法論的留保：疲労を対象とするアトラスで有効性判定する群間疲労尺度が一次抄録にない。抑うつ改善を代用しない。","score":null,"certainty":null,"population":"双極性うつ","outcome":"IDS臨床家評価抑うつ重症度変化 / 疲労尺度の群間差は抄録に記載なし","related":[{"id":"f5_modafinil","name":"モダフィニル（疾患別比較）"}],"linked_intervention_identified":false},{"title":"一般精神疾患休職者：患者中心型eHealth","doi":"10.1080/02813432.2025.2533997","pmid":"40702943","url":"https://pubmed.ncbi.nlm.nih.gov/40702943/","easy":"精神疾患で休職中の人を対象とした患者中心型eHealthの試験では、通常ケアより疲労尺度の改善が報告されました。ただし追跡できた人に偏る可能性があり、欠測の影響に注意が必要です。","standard":"精神疾患で休職中の人を対象とした患者中心型eHealthの試験では、通常ケアより疲労尺度の改善が報告されました。ただし追跡できた人に偏る可能性があり、欠測の影響に注意が必要です。\n\n対象：一般的な精神疾患による休職者。人数：209（介入102・TAU107）。デザイン・比較：親RCTの疲労二次解析。実施条件：患者中心eHealth（電話＋双方向デジタル基盤）＋TAU vs TAU。\n主要・副次の区別：親RCTの主要評価は本副報から確定しない。MFI-20疲労副次。\n結果（出典の記載）：RCT n=209 randomized (eHealth+TAU 102, TAU 107); global MFI-20 baseline intervention 79.6±12.7 (n=101) control 76.2±13.5 (n=107). Changes: at 3m -12.8±12.5 (n=81) vs -5.2±14.5 (n=81), group p<.001; 6m -18.0±16.1 (n=81) vs -10.6±17.8 (n=94), group p=.003. General fatigue 3m p=.206, 6m p=.039. Median change contrasts also tabulated; no adjusted treatment mean difference or 95%CI extracted.。\n解釈上の限界：Non-ITT complete-case follow-up comparisons likely; analyses in article use Mann–Whitney for group differences. Shared parent trial NCT03404583; no new independent STU. Higher MFI-20 indicates worse fatigue, so negative change improves.","research":"対象・試験設計：対象：一般的な精神疾患による休職者。人数：209（介入102・TAU107）。デザイン・比較：親RCTの疲労二次解析。実施条件：患者中心eHealth（電話＋双方向デジタル基盤）＋TAU vs TAU。\n評価項目の位置づけ：親RCTの主要評価は本副報から確定しない。MFI-20疲労副次。\n疲労尺度・方向性：親RCTの主要評価は本副報から確定しない。MFI-20疲労副次。\n報告された比較結果（報告値）：RCT n=209 randomized (eHealth+TAU 102, TAU 107); global MFI-20 baseline intervention 79.6±12.7 (n=101) control 76.2±13.5 (n=107). Changes: at 3m -12.8±12.5 (n=81) vs -5.2±14.5 (n=81), group p<.001; 6m -18.0±16.1 (n=81) vs -10.6±17.8 (n=94), group p=.003. General fatigue 3m p=.206, 6m p=.039. Median change contrasts also tabulated; no adjusted treatment mean difference or 95%CI extracted.。\n有害事象・PEM・脱落：PEM unassessed. Attrition at 3m 21/102 intervention and 26/107 control for global fatigue; at 6m 21/102 intervention and 13/107 control, possible informative missingness; specific adverse event table not verified.。\n方法論的留保：Non-ITT complete-case follow-up comparisons likely; analyses in article use Mann–Whitney for group differences. Shared parent trial NCT03404583; no new independent STU. Higher MFI-20 indicates worse fatigue, so negative change improves.。","score":1,"certainty":"D","population":"一般的な精神疾患による休職者","outcome":"親RCTの主要評価は本副報から確定しない。MFI-20疲労副次","related":[{"id":"f5_cmd01","name":"デジタル併用の患者中心eHealth支援"}],"linked_intervention_identified":false},{"title":"ACT/ヨガ等の動画eHealth","doi":"10.1177/15347354231153172","pmid":"36799503","url":"https://journals.sagepub.com/doi/10.1177/15347354231153172","easy":"がん患者を対象としたACT・心理教育・ヨガ等の動画プログラムでは、対照群に比べた疲労の改善は確認されませんでした（群間比較p=.72）。両群で時間とともに改善しても、介入固有の効果を示すものではありません。","standard":"対象：がん関連疲労（157 randomized with various cancers）。介入・比較：8 video sequences during 4 weeks: psychoeducation + ACT components + yoga/qigong。評価の位置づけ：Anxiety GAD-7 and fear of progression; fatigue QLQ-FA12 SECONDARY / EORTC QLQ-FA12 higher=worse fatigue。結果：Fatigue between-arm p=.72 NULL. Also primary GAD7 p=.75, fear of progression p=.29; depression p=.95 null.。重要な留保：Authors conclude no between-arm fatigue benefit; despite both arms improving in time; waitlist and unblinded.。","research":"文献：ACT/ヨガ等の動画eHealth。PMID 36799503、DOI 10.1177/15347354231153172。\n対象・規模：がん関連疲労。157 randomized with various cancers\n研究デザイン：Parallel RCT open 4-week video-based eHealth vs waiting control\n介入条件：8 video sequences during 4 weeks: psychoeducation + ACT components + yoga/qigong\n主要／副次・疲労の位置づけ：Anxiety GAD-7 and fear of progression; fatigue QLQ-FA12 SECONDARY / EORTC QLQ-FA12 higher=worse fatigue\n比較結果・限界：Fatigue between-arm p=.72 NULL. Also primary GAD7 p=.75, fear of progression p=.29; depression p=.95 null.\n有害事象・脱落・PEM：Adherence was not objectively monitorable, harms not systematically extracted. Missingness exact counts pending.\n解釈上の留保：Authors conclude no between-arm fatigue benefit; despite both arms improving in time; waitlist and unblinded.\n出典URL：https://journals.sagepub.com/doi/10.1177/15347354231153172","score":0,"certainty":"C","related":[{"id":"act","name":"ACT・アクセプタンス"},{"id":"qigong","name":"気功"},{"id":"f5_crf01","name":"がん疲労：動画心理教育・活動カウンセリング"}],"population":"がん関連疲労","outcome":"Anxiety GAD-7 and fear of progression; fatigue QLQ-FA12 SECONDARY / EORTC QLQ-FA12 higher=worse fatigue","linked_intervention_identified":false},{"title":"サフラン補充と疲労MFI","doi":"10.1016/j.ajcnut.2025.09.050","pmid":"41047129","url":"https://pubmed.ncbi.nlm.nih.gov/41047129/","easy":"抑うつ傾向のある健康成人でのサフラン補充は、主要複合指標と疲労単独尺度のいずれでも明確な群間優越性が確認されませんでした。","standard":"抑うつ傾向のある健康成人でのサフラン補充は、主要複合指標と疲労単独尺度のいずれでも明確な群間優越性が確認されませんでした。\n\n対象：健康成人だが閾値下抑うつ症状51人。人数：健康成人だが閾値下抑うつ症状51人。デザイン・比較：サフラン抽出物 vs 偽薬6週、二重盲検RCT。実施条件：サフラン抽出物 vs 偽薬6週、二重盲検RCT。\n主要・副次の区別：主要はBDI-II、STAI-YA、MFI-20を合成したzスコア；疲労単独も評価。\n結果（出典の記載）：主要複合zスコアは非有意、疲労単独MFIも群間有意差なし。\n解釈上の限界：製造関連企業著者・資金の利益相反確認。","research":"対象・試験設計：対象：健康成人だが閾値下抑うつ症状51人。人数：健康成人だが閾値下抑うつ症状51人。デザイン・比較：サフラン抽出物 vs 偽薬6週、二重盲検RCT。実施条件：サフラン抽出物 vs 偽薬6週、二重盲検RCT。\n評価項目の位置づけ：主要はBDI-II、STAI-YA、MFI-20を合成したzスコア；疲労単独も評価。\n疲労尺度・方向性：主要はBDI-II、STAI-YA、MFI-20を合成したzスコア；疲労単独も評価。\n報告された比較結果（報告値）：主要複合zスコアは非有意、疲労単独MFIも群間有意差なし。\n有害事象・PEM・脱落：AE/脱落詳細は抄録不明。\n方法論的留保：製造関連企業著者・資金の利益相反確認。","score":0,"certainty":"C","population":"健康成人だが閾値下抑うつ症状51人","outcome":"主要はBDI-II、STAI-YA、MFI-20を合成したzスコア；疲労単独も評価","related":[{"id":"f5_saffron","name":"サフラン製剤"}],"linked_intervention_identified":false},{"title":"10時間TRE＋栄養指導 vs 栄養指導","doi":"10.1007/s00520-025-09394-w","pmid":"40186671","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12547982/","easy":"がん治療後の人に、食事時間を10時間に制限する方法と栄養指導を組み合わせた小規模試験です。疲労尺度は改善方向でしたが、通常の5％有意水準では群間差を確認できませんでした（p=.11）。探索的な結果として解釈する必要があります。","standard":"対象：食事パターン/がん（30 randomized; 25 completed 12 weeks）。介入・比較：10-h self-selected daily eating window + individualized nutrition counseling vs usual unrestricted eating + the same nutrition counseling, 12 weeks。評価の位置づけ：Feasibility emphasized in registration; FACIT-F fatigue preliminary outcome / FACIT-F higher=less fatigue。結果：FACIT-F change +4.1±5.7 TRE vs 0.0±5.4 control, baseline-adjusted between-arm p=.11, Cohen d=.70. Mixed model group-by-time p=.069. NOT conventionally statistically significant; prespecified rtainty":null,"population":"看護師の疲労","outcome":"知覚ストレス／FSS疲労（両方研究質問） / FSS低いほど良い。介入後3.06±0.65 対3.99±0.77、p<.001","related":[{"id":"f5_f0c_058","name":"オンライン瞑想（看護職）"}],"linked_intervention_identified":false},{"title":"RENEW 生活エネルギー管理・ピア支援","doi":"10.1002/acr.25253","pmid":"37846437","url":"https://pubmed.ncbi.nlm.nih.gov/37846437/","easy":"全身性強皮症の疲労に対するRENEWの支援では、待機群と比べて疲労の改善が報告されました。疲労尺度の得点方向が通常と逆になるよう変換されている点に注意が必要です。","standard":"全身性強皮症の疲労に対するRENEWの支援では、待機群と比べて疲労の改善が報告されました。疲労尺度の得点方向が通常と逆になるよう変換されている点に注意が必要です。\n\n対象：医師診断の全身性強皮症、中等度〜重度疲労。人数：173（割付2:1）。デザイン・比較：12週、非盲検待機対照RCT、混合モデル・多重代入。実施条件：教育ウェブ/アプリ＋9回のオンラインピアコーチング vs 待機。\n主要・副次の区別：FACIT-Fatigueの12週変化。\n結果（出典の記載）：RENEW 12w, 2:1 randomization in 173 systemic sclerosis adults. Waitlist comparison. FACIT-Fatigue raw score converted to PROMIS T score in this trial, HIGHER score = greater fatigue. Adjusted 12-week difference -4.7 T points [95%CI -6.7,-2.7], p<.001, beneficial; unadjusted difference -3.6 [-5.8,-1.3]. ITT linear mixed models with multiple imputation (20 datasets); 464/519 (89.4%) planned measurements complete.。\n解釈上の限界：Negative β reflects lower/worse-fatigue T-score, NOT deterioration. This is a specific transformed score, not conventional FACIT-F 0–52 orientation. Intervention combines online materials and nine peer coaching sessions; cannot attribute to one component.","research":"対象・試験設計：対象：医師診断の全身性強皮症、中等度〜重度疲労。人数：173（割付2:1）。デザイン・比較：12週、非盲検待機対照RCT、混合モデル・多重代入。実施条件：教育ウェブ/アプリ＋9回のオンラインピアコーチング vs 待機。\n評価項目の位置づけ：FACIT-Fatigueの12週変化。\n疲労尺度・方向性：FACIT-Fatigueの12週変化。\n報告された比較結果（報告値）：RENEW 12w, 2:1 randomization in 173 systemic sclerosis adults. Waitlist comparison. FACIT-Fatigue raw score converted to PROMIS T score in this trial, HIGHER score = greater fatigue. Adjusted 12-week difference -4.7 T points [95%CI -6.7,-2.7], p<.001, beneficial; unadjusted difference -3.6 [-5.8,-1.3]. ITT linear mixed models with multiple imputation (20 datasets); 464/519 (89.4%) planned measurements complete.。\n有害事象・PEM・脱落：Waitlist, 尺度・方向性：SF-36 MCS/PCSを主要。\n報告された比較結果（報告値）：reclarit digital CBT + TAU vs TAU + education active control. ITT 170 vs 184. BRAF-MDQ fatigue secondary, 3m adjusted ANCOVA mean difference -4.0 [95%CI -6.6,-1.4], p=.003; 6m -4.2 [-6.9,-1.5], p=.002. Baseline fatigue 33.8±12.4 vs 32.1±12.5. 3m means 29.1±13.5 vs 31.9±13.9; 6m 27.7±13.9 vs 30.7±14.5. SF-36 MCS primary ITT 3m +3.3 [0.7,5.9], p=.014, PCS non-significant.。\n有害事象・PEM・脱落：Study active informational control, not sham. Participant blinding impossible; AE/attrition not fully reviewed in this supplement. PP also reported separately.。\n方法論的留保：BRAF-MDQ high = more fatigue, so negative adjusted contrast = improvement; difference is 3/6m fatigue secondary not primary. No inference about ME/CFS/PEM. Table 5 Cohen d CI contains suspicious typographical range at 6m; use ANCOVA mean difference and 95%CI.。","score":1,"certainty":"C","related":[{"id":"cbt","name":"CBT・行動療法"}],"population":"RA成人、QOL低下","outcome":"SF-36 MCS/PCSを主要","linked_intervention_identified":false},{"title":"高強度インターバル＋筋トレ 対一般活動助言","doi":"10.1186/s13075-025-03643-3","pmid":"40968365","url":"https://pubmed.ncbi.nlm.nih.gov/40968365/","easy":"関節リウマチの人87人を対象にした試験で、12週間の監督付き高強度運動と筋トレを行った群は、一般的な運動助言を受けた群より疲労が改善しました。ただし、ME/CFSのPEMがある人に安全・有効という結果ではありません。","standard":"関節リウマチの多施設RCT（87人）では、12週間の監督下HIIT＋筋力訓練により、運動助言群に比べ3か月時のMFI-20一般疲労が平均4.0点、身体疲労が4.9点改善しました（いずれも群間調整差）。6か月時にも改善がみられましたが、12か月時の疲労効果は身体疲労など一部に限られます。","research":"RAのRCT（n=87、43対44）でMFI-20一般疲労の3か月群間調整差−4.0（95%CI −5.57〜−2.39）、身体疲労−4.9（−6.43〜−3.36）。ITT感度分析も近い推定。標本数の設計根拠は疲労ではなく元試験のVO2max。介入はHIIT＋筋力の複合介入で、参加者盲検不能。NCT05768165など同一試験系列の最終照合、脱落・有害事象・PEMの正式確認が必要。","score":1,"certainty":"D","population":"関節リウマチ","outcome":"Multidimensional Fatigue Inventory 20, sleep/mood/QoL among assessed outcomes / MFI20 lower=less fatigue","related":[{"id":"f5_hiitreha","name":"高強度間欠運動（疾患別プロトコル）"}],"linked_intervention_identified":false},{"title":"Fitbit＋アプリ＋遠隔理学療法相談","doi":"10.1093/rheumatology/kead709","pmid":"38152927","url":"https://pubmed.ncbi.nlm.nih.gov/38152927/","easy":"関節リウマチ患者の活動支援アプリ・遠隔理学療法相談を組み合わせた研究では、疲労尺度に小さな改善が報告されました。ただし複数の比較方法が使われているため、その差を一つの効果量として扱うことはできません。","standard":"対象：RA患者131人、女性91.6%（RA患者131人、女性91.6%）。介入・比較：Fitbit＋自己管理アプリ＋集団教育＋遠隔PT相談 vs 26週遅延介入/ニュースレター、53週追跡。評価の位置づけ：主要PAM-13患者活性化、疲労は副次。結果：Mixed-effects model FSS (secondary): contrast1 randomized immediate vs delayed -0.3 [95%CI -0.7,-0.2]; contrast3 pooled intervention effect -0.3 [95%CI -0.5,-0.1], p=.01, Cohen d=.32. These are different contrasts.。重要な留保：遅延群の53週後改善は追加介入後の群内変化。","research":"文献：Fitbit＋アプリ＋遠隔理学療法相談。PMID 38152927、DOI 10.1093/rheumatology/kead709。\n対象・規模：RA患者131人、女性91.6%。RA患者131人、女性91.6%\n研究デザイン：Fitbit＋自己管理アプリ＋集団教育＋遠隔PT相談 vs 26週遅延介入/ニュースレター、53週追跡\n介入条件：Fitbit＋自己管理アプリ＋集団教育＋遠隔PT相談 vs 26週遅延介入/ニュースレター、53週追跡\n主要／副次・疲労の位置づけ：主要PAM-13患者活性化、疲労は副次\n比較結果・限界：Mixed-effects model FSS (secondary): contrast1 randomized immediate vs delayed -0.3 [95%CI -0.7,-0.2]; contrast3 pooled intervention effect -0.3 [95%CI -0.5,-0.1], p=.01, Cohen d=.32. These are different contrasts.\n有害事象・脱落・PEM：COVID時期に80.2%が参加、AE・欠測詳細不明。\n解釈上の留保：遅延群の53週後改善は追加介入後の群内変化。\n出典URL：https://pubmed.ncbi.nlm.nih.gov/38152927/","score":1,"certainty":"D","population":"RA患者131人、女性91.6%","outcome":"主要PAM-13患者活性化、疲労は副次","related":[{"id":"f5_f0c_064","name":"関節リウマチ：ウェアラブル・遠隔運動支援"}],"linked_intervention_identified":false},{"title":"指圧介入 対対照","doi":"10.1089/jicm.2022.0644","pmid":"36413013","url":"https://journals.sagepub.com/doi/full/10.1089/jicm.2022.0644","easy":"透析患者への指圧と偽指圧を比較した研究では、疲労尺度が指圧群で改善したと報告されています。調整後の回帰係数は−1.71であり、これは標準化効果量（Cohenのd）ではありません。","standard":"対象：透析関連疲労（106無作為化）。介入・比較：単盲検・偽指圧対照、K1/ST36/SP6を両側各3分・週3回4週、対照は該当点から1寸離れた偽指圧。評価の位置づけ：BFI疲労重症度 / BFI低いほど疲労軽い。結果：Adjusted model b=-1.71 (95%CI -1.90 to -1.51), in favor of acupressure, fatigue primary; sleep/anxiety/depression secondary. Difference is a regression coefficient, NOT Cohen d.。重要な留保：Sham acupressure may have physiological action; small single-center setting and incomplete analysis details.。","research":"文献：指圧介入 対対照。PMID 36413013、DOI 10.1089/jicm.2022.0644。\n対象・規模：透析関連疲労。106無作為化\n研究デザイン：単盲検・偽指圧対照、K1/ST36/SP6を両側各3分・週3回4週、対照は該当点から1寸離れた偽指圧\n介入条件：単盲検・偽指圧対照、K1/ST36/SP6を両側各3分・週3回4週、対照は該当点から1寸離れた偽指圧\n主要／副次・疲労の位置づけ：BFI疲労重症度 / BFI低いほど疲労軽い\n比較結果・限界：Adjusted model b=-1.71 (95%CI -1.90 to -1.51), in favor of acupressure, fatigue primary; sleep/anxiety/depression secondary. Difference is a regression coefficient, NOT Cohen d.\n有害事象・脱落・PEM：Authors report no acupressure adverse events. Exact attrition/ITT not confirmed from accessible abstract; PEM not specifically measured.\n解釈上の留保：Sham acupressure may have physiological action; small single-center setting and incomplete analysis details.\n出典URL：https://journals.sagepub.com/doi/full/10.1089/jicm.2022.0644","score":1,"certainty":"C","population":"透析関連疲労","outcome":"BFI疲労重症度 / BFI低いほど疲労軽い","related":[{"id":"selfacup","name":"単盲検・偽指圧対照"}],"linked_intervention_identified":false},{"title":"スマホ娯楽療法（音楽/コメディ/教育）","doi":"10.1186/s12882-024-03807-4","pmid":"39428505","url":"https://pubmed.ncbi.nlm.nih.gov/39428505/","easy":"血液透析中のスマートフォン娯楽療法では、対照群より疲労得点が低いという報告があります。ただし抄録と表で下位尺度の記述に食い違いがあり、効果判定を慎重に扱います。","standard":"血液透析中のスマートフォン娯楽療法では、対照群より疲労得点が低いという報告があります。ただし抄録と表で下位尺度の記述に食い違いがあり、効果判定を慎重に扱います。\n\n対象：血液透析患者。人数：72（36/36）。デザイン・比較：通常ケア対照、ランダム化2群試験、30日。実施条件：スマホの音楽・コメディ・運動・教育の娯楽療法アプリ vs 標準ケア。\n主要・副次の区別：MFI-20疲労総点および下位尺度。\n結果（出典の記載）：72 HD patients, 36+36. MFI-20 total baseline 53.6±14.1 vs 57.4±11.9 (p=.196). After 30d smartphone recreational app vs usual care: 42.3±16.8 vs 62.5±13.2, unadjusted post-treatment between-group p<.001. In Table 3 mental fatigue after 30d 8.0±4.3 vs 9.5±4.7, between-group p=.162 (NOT significant), despite general/physical and several other subscales p<.001.。\n解釈上の限界：CRITICAL abstract/table conflict: abstract says all fatigue dimensions significantly improved compared to control; mental fatigue subgroup does not show statistical superiority in raw Table 3. Treatment includes music, comedy, exercise and education, so no single-component effect…","research":"対象・試験設計：対象：血液透析患者。人数：72（36/36）。デザイン・比較：通常ケア対照、ランダム化2群試験、30日。実施条件：スマホの音楽・コメディ・運動・教育の娯楽療法アプリ vs 標準ケア。\n評価項目の位置づけ：MFI-20疲労総点および下位尺度。\n疲労尺度・方向性：MFI-20疲労総点および下位尺度。\n報告された比較結果（報告値）：72 HD patients, 36+36. MFI-20 total baseline 53.6±14.1 vs 57.4±11.9 (p=.196). After 30d smartphone recreational app vs usual care: 42.3±16.8 vs 62.5±13.2, unadjusted post-treatment between-group p<.001. In Table 3 mental fatigue after 30d 8.0±4.3 vs 9.5±4.7, between-group p=.162 (NOT significant), despite general/physical and several other subscales p<.001.。\n有害事象・PEM・脱落：Blinding unlikely; relatively short follow-up and n72. Full adverse event quantitation/ITT and adjusted CI not verified; reported p-value is post-score independent-samples t-test (not ANCOVA).。\n方法論的留保：CRITICAL abstract/table conflict: abstract says all fatigue dimensions significantly improved compared to control; mental fatigue subgroup does not show statistical superiority in raw Table 3. Treatment includes music, comedy, exercise and education, so no single-component effect.。","score":1,"certainty":"D","population":"血液透析患者","outcome":"MFI-20疲労総点および下位尺度","related":[{"id":"f5_f0c_066","name":"透析患者：娯楽療法アプリ"}],"linked_intervention_identified":false},{"title":"メチルフェニデート用量クロスオーバー","doi":"10.3109/02699052.2015.1004747","pmid":"25794299","url":"https://pubmed.ncbi.nlm.nih.gov/25794299/","easy":"外傷性脳損傷後の精神疲労に対するメチルフェニデートの用量比較クロスオーバー試験では、高用量期に疲労の改善が報告されました。ただし持ち越し効果や期間別比較の詳細は十分に確認できていません。","standard":"対象：外傷性脳損傷（51登録/44完遂）。介入・比較：TBI患者、4週間ずつ無投薬・低用量（最大5mg×3/日）・高用量（最大20mg×3/日）の3期を順序無作為化。評価の位置づけ：Mental Fatigue Scale(MFS)、処理速度 / MFSは低いほど良い。用量依存の精神疲労改善が報告。結果：3-period 12-week within-person randomized crossover (n=51 enrolled; 44 complete); high-dose up to methylphenidate 20 mg three times daily associated with greater mental-fatigue scale improvement (dose-dependent); exact period contrasts and carryover tests not disclosed in accessible abstract.。重要な留保：No numeric group/period contras 化とレジメン差を分けます。","research":"対象・比較条件：C型肝炎。n=793 analyzed in secondary report of PRIORITIZE randomized trial。Chronic HCV viral cure; 2 active antiviral regimens LDV/SOF vs EBR/GZR; secondary longitudinal patient-report analysis。介入：Ledipasvir/sofosbuvir vs elbasvir/grazoprevir, longitudinal after sustained viral response。主要／副次の位置づけ：Symptoms incl fatigue measured at baseline, median 6 months, median 21 months after。結果：Within LDV/SOF fatigue -6.41 and EBR/GZR -4.67 from baseline at early phase; regimen between differences small/clinically equivalent。害・欠測・PEM：Regimen safety and full AE tables not abstracted。解釈上の留保：Within-person viral cure improvement cannot be interpreted as efficacy versus untreated care; no separate independent trial。","score":null,"certainty":null,"population":"C型肝炎","outcome":"Symptoms incl fatigue measured at baseline, median 6 months, median 21 months after / Self-reported fatigue lower=better","related":[{"id":"f5_f0c_072","name":"C型肝炎：抗ウイルス薬の比較"}],"linked_intervention_identified":false},{"title":"漢方配合 vs 偽薬（疲労・活力）","doi":"","pmid":"15226169","url":"https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/217130","easy":"C型肝炎患者への10種類の生薬を含む漢方配合薬を偽薬と比較した研究では、活力や生活の質に明確な群間差は確認されませんでした。副作用の報告もあり、有効性を示す根拠として扱えません。","standard":"対象：C型肝炎（45 HCV with fatigue randomized）。介入・比較：Combination Chinese herbs vs matched placebo 12 weeks (formula composition not in abstract)。評価の位置づけ：Hepatitis QoL vitality, role-physical and ALT (liver enzymes) / Vitality higher=better proxy; direct validated fatigue severity not isolated。結果：45 hepatitis C fatigue patients randomized 23 herb/22 placebo, blinded 10-herb formula 10g daily for 12 weeks; role-physical and vitality HQLQ proxy outcomes all group comparisons null, no quality-of-life benefit; ITT used. 37 completed week 12. Any AE:19/23 active versus19/22 placebo, p>.99. 3 ALT elevation discontinu。重要な留保：Vitality is energy/QOL PROXY, not direct fatigue severity. No superiority. Ingredient composition is in original. E iovascular risk; 12 intervention dropouts and 6 control nonresponse\n研究デザイン：SLE; 6-month randomized lifestyle intervention vs standard care; 2020-2023 Sao Paulo\n介入条件：Living Well With Lupus (LWWL) behavioral goal-setting home exercise + nutritional counseling vs standard care\n主要／副次・疲労の位置づけ：Overall wellbeing and SF-36 physical role; fatigue FACIT-F SECONDARY / FACIT-F higher=less fatigue\n比較結果・限界：Fatigue FACIT-F SECONDARY adjusted EMD +7.1 (95%CI 1.6 to12.6) p=.01 in favor; parent trial primary cardiometabolic score BETWEEN-arm p=.96 NULL.\n有害事象・脱落・PEM：18/80 missing at postassessment; parent reports intervention adherence 56.9%; exercise harms and PEM not given.\n解釈上の留保：Same NCT04431167 as 2024 parent report, count once. Fatigue secondary positive despite primary cardiometabolic endpoint null. Multiple intervention components, no extrapolation to ME/CFS.\n出典URL：https://pubmed.ncbi.nlm.nih.gov/41165066/","score":1,"certainty":"D","population":"全身性エリテマトーデス/生活習慣","outcome":"Overall wellbeing and SF-36 physical role; fatigue FACIT-F SECONDARY / FACIT-F higher=less fatigue","related":[{"id":"f5_f0c_090","name":"SLE：行動目標設定プログラム"}],"linked_intervention_identified":false},{"title":"PBC：セラデルパルRESPONSE試験の掻痒・睡眠・疲労","doi":"10.1111/apt.70630","pmid":"41933275","url":"https://pubmed.ncbi.nlm.nih.gov/41933275/","easy":"PBCのセラデルパル試験の重度かゆみサブグループでは疲労改善が示唆されましたが、事後解析であり全PBC患者への効果や独立RCTを意味しません。","standard":"PBCのセラデルパル試験の重度かゆみサブグループでは疲労改善が示唆されましたが、事後解析であり全PBC患者への効果や独立RCTを意味しません。\n\n対象：PBC with inadequate UDCA response/intolerance; baseline itch subgroup NRS>=7; overall trial N n…。人数：PBC with inadequate UDCA response/intolerance; baseline itch subgroup NRS>=7; overall trial N n…。デザイン・比較：RESPONSE NCT04620733 secondary publication; 12-month 2:1 randomized seladelpar 10mg/day vs placebo; original parent trial is one STU。実施条件：seladelpar 10mg once daily vs placebo for 12 months。\n主要・副次の区別：Biochemical response parent primary; 5-D itch, sleep, PBC-40 fatigue subgroup exploratory。\n結果（出典の記載）：Sev ttention control; implausibly very large effect estimate without standardized-scale check; no ME/CFS transport","research":"対象・試験設計：対象：多発性硬化症。人数：78 randomized (38 Bhramari vs 40 routine care)。デザイン・比較：MS patients in Iran; minimization random allocation, open routine-care control, 4 weeks。実施条件：Bhramari pranayama breathing/yoga 20 min twice daily for 4 weeks vs routine care。\n評価項目の位置づけ：FSS fatigue and BDI-II depression。\n疲労尺度・方向性：FSS higher=worse fatigue。\n報告された比較結果（報告値）：Post-treatment fatigue between groups p<0.01; printed CI [-25.34,-17.81], effect-size -2.80; units/scale and standardized vs raw values need validation。\n有害事象・PEM・脱落：Exercise/respiratory load; adverse event and PEM ascertainment not established。\n方法論的留保：No sham/attention control; implausibly very large effect estimate without standardized-scale check; no ME/CFS transport。","score":null,"certainty":null,"population":"多発性硬化症","outcome":"FSS fatigue and BDI-II depression / FSS higher=worse fatigue","related":[{"id":"f5_pranayama","name":"プラーナーヤーマ・呼吸法"}],"linked_intervention_identified":false},{"title":"生活・活動管理OTプログラム vs 通常ケア","doi":"10.5014/ajot.2026.051512","pmid":"42089815","url":"https://pubmed.ncbi.nlm.nih.gov/42089815/","easy":"関節リウマチ患者への作業療法に基づく生活・活動管理プログラムでは、疲労の副次評価に改善が報告されました。ただし群間差の解析値は標準化効果量ではなく、追跡人数と解析方法に注意が必要です。","standard":"対象：RA外来患者45人（介入23、対照22）（45 randomized (23 LI/22 control); 39 postintervention; 33 complete-case (16 LI/17 control).）。介入・比較：作業療法ベース8セッションの生活介入（省エネ行動、活動・習慣） vs 4週間週2回の健康確認電話＋通常治療。評価の位置づけ：主要COPM遂行、副次BRAF多次元疲労、COPM満足、疼痛、QOLなど。結果：BRAF-MDQ secondary fatigue: Mann-Whitney between-group at postintervention z=-3.337,p<.001, at 6 months z=-4.059,p<.001; baseline p=.614. NOT 45-patient ITT, NOT adjusted change estimate.。重要な留保：盲検は評価者を含め詳細不明、参加者は実質盲検困難。","research":"文献：生活・活動管理OTプログラム vs 通常ケア。PMID 42089815、DOI 10.5014/ajot.2026.051512。\n対象・規模：RA外来患者45人（介入23、対照22）。45 randomized (23 LI/22 control); 39 postintervention; 33 complete-case (16 LI/17 control).\n研究デザイン：Online allocation conceal list.append(a)}count.textContent=matched.length+'件の文献'+(matched.length>limit?'（'+limit+'件を表示）':'');more.hidden=matched.length<=limit;}try{const p=new URLSearchParams(location.search);const key=p.get('pmid')||p.get('doi');if(key)search.value=key;}catch(_e){}search.addEventListener('input',()=>{limit=24;render()});level.addEventListener('change',render);more.addEventListener('click',()=>{limit+=24;render()});render();})();
