<style>

p:wrap}.tabs{display:flex;background:var(--sub);border-radius:11px;padding:3px;gap:3px}.tabs button{background:none;border:0;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:650;color:var(--muted)}.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px #00000012}.smallnote{font-size:11px;color:var(--muted)}.board-scroll{overflow-x:auto;overflow-y:visible;padding-bottom:10px;scrollbar-width:thin;scroll-behavior:auto}.board{display:grid;grid-template-columns:repeat(5,minmax(205px,1fr));gap:10px;min-width:1065px}.lane{min-height:310px;background:var(--sub);border:1px solid var(--line);border-radius:13px;padding:9px;transition:background .12s,border .12s}.lane.over{border:2px dashed var(--accent);background:var(--tint)}.lane-heading{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 10px}.lane-name{font-weight:800;font-size:13px}.count{font-size:11px;color:var(--muted)}.lane-body{display:flex;flex-direction:column;gap:7px;min-height:220px}.task-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 7px;display:flex;align-items:center;gap:7px;min-height:56px;box-shadow:0 1px 2px #00000008}.task-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.drag-handle{flex:0 0 34px;min-height:40px;border:0;background:var(--sub);border-radius:8px;font-size:20px;color:var(--muted);touch-action:none;cursor:grab;user-select:none;display:grid;place-items:center}.drag-handle:active{cursor:grabbing}.card-main{border:0;background:none;text-align:left;padding:2px 0;flex:1;min-width:0;line-height:1.5}.card-title{font-size:12px;font-weight:650;word-break:break-word}.card-meta{color:var(--muted);font-size:10px;margin-top:4px}.finish{width:29px;height:29px;border-radius:50%;border:1px solid var(--line);background:var(--surface);flex:0 0 29px}.finish:hover{background:var(--tint);border-color:var(--accent)}.empty{border:1px dashed var(--line);border-radius:8 /* v0.4 */

.daily-add,.recurrence label{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;cursor:pointer}.daily-add{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:42px}
input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px}.recurrence{margin:13px 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--tint);padding:11px;border-radius:10px}.schedule-edit{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}.schedule-edit .flex label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.schedule-edit input,.cal-date-label input{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;max-width:155px;font-size:12px}.schedule-edit .smallnote{margin:8px 0 0}
.card-meta .daily-mark{font-weight:750;color:var(--accent)}
.calendar{display:flex;flex-direction:column;gap:10px}.cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.cal-date-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.cal-day{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 2px;text-align:center;font-size:12px;min-height:54px}.cal-day span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.cal-day.on{border:2px solid var(--accent);background:var(--tint);font-weight:800}.cal-day.today{color:var(--accent)}
.cal-unscheduled{border:1px solid var(--line);border-radius:12px;padding:9px;background:var(--sub)}.cal-unscheduled.over,.cal-pool.over{outline:2px dashed var(--accent);background:var(--tint)}.cal-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:2px 3px 9px}.cal-pool{min-height:57px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;padding:4px;border-radius:9px}.cal-card{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-height:38px;max-width:100%}.cal-card.active{outline:2px solid var(--accent)}.cal-card button[data-select]{flex:1;text-align:left;font-size:12px;font-weight:650;background:none;border:0;min-width:0;overflow-wrap:anywhere}.cal-card .drag-handle{flex-basis:30px;min-height:31px;font-size:18px}.cal-card .timemark{font-size:10px;color:var(--muted)}

@media(max-width:580px){.calendar .smallnote{max-width:none;text-align:left}.tabs{width:100%}.tabs button{flex:1;padding:9px 6px;font-size:11px}.cal-timeline{max-height:66vh}.cal-day{min-height:49px}.cal-slot{grid-template-columns:54px minmax(0,1fr)}.cal-toolbar .btn{padding:6px 8px}.stagebuttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.stagebuttons button{min-height:39px}}


/* v0.6 project grouping, independent daily completions, flexible editors */
.project-stack{display:flex;flex-direction:column;gap:4px}.task-card.is-project{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--tint) 45%,var(--surface))}.fold-btn{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--accent);width:25px;height:28px;flex:0 0 25px;font-size:18px;cursor:pointer}.project-children{margin-left:17px;padding-left:8px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:4px}.project-drop-note{font-size:10px;color:var(--muted);padding:10px 5px;border:1px dashed var(--line);border-radius:7px}.list-row.project-row{background:var(--tint)}.list-row.nested{padding-left:27px}.project-edit{margin:12px 0;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--sub)}.project-edit select{flex:1 1 185px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--surface)}.project-member-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}.project-member{display:flex;align-items:center;justify-content:space-between;gap:7px;border-top:1px solid var(--line);padding-top:6px;font-size:12px}.project-member span{flex:1;overflow-wrap:anywhere}.today-done{padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-top:12px}.today-done-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 5px;border-top:1px solid var(--line);font-size:12px}.today-done-row:first-child{border:0}.today-done-row time{color:var(--muted);white-space:nowrap;font-size:11px}.editing input,.editing textarea{max-width:100%;min-width:100%}.detailgrid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.detailgrid textarea{min-height:52px;max-height:500px;overflow-y:auto;resize:vertical;field-sizing:content;line-height:1.5;overflow-wrap:anywhere}.detailgrid>div{min-width:0}@media(max-width:620px){.detailgrid{grid-template-columns:minmax(0,1fr)}.project-children{margin-left:12px}}

/* === 油屋 夜の帳場 — visual skin v0.7 | state/logic remain v0.6-compatible === */
:root{color-scheme:light;--bg:#271b1c;--surface:#fff6e6;--sub:#efe1c6;--ink:#473126;--muted:#806652;--line:#c7a981;--accent:#9f4539;--tint:#f7e0c6;--shadow:0 6px 18px #32201722;--paper:#fff8e9;--vermilion:#a33b36;--gold:#c89c58;--wood:#4a2b2b;--forest:#56725c}
body{background:radial-gradient(ellipse at 75% -20%,#70443688 0%,transparent 50%),radial-gradient(ellipse at 0 100%,#4f413c 0%,transparent 62%),#261b1e;color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic", "Noto Sans JP",system-ui,sans-serif;min-height:100vh;font-size:14px}
.app{max-width:1240px;min-height:100vh;padding:15px 17px 36px;background:linear-gradient(90deg,#422d2730 0,transparent 2%,transparent 98%,#422d2730 100%),#f1e5cc;border-left:3px solid #a36945;border-right:3px solid #a36945;box-shadow:0 0 90px #0b0809a6}
.bathhouse-hero{position:relative;isolation:isolate;align-items:center;min-height:188px;overflow:hidden;border:4px solid #57342e;border-radius:10px;padding:21px 25px 24px 20px;margin-bottom:16px;color:#fff0cf;background-color:#3a2a29;background-image:linear-gradient(90deg,#291d21f5 0%,#351f24ed 22%,#3b2728a8 46%,#1a172046 100%),url("");background-size:cover;background-position:center 43%;box-shadow:inset 0 0 0 2px #d5a66e,0 8px 18px #321d1890}
.bathhouse-hero:before{content:"";position:absolute;inset:9px;border:1px solid #e5ac6777;pointer-events:none;z-index:-1}
.bathhouse-hero:after{content:"◆  今宵の仕事帖  ◆";position:absolute;left:22px;bottom:7px;font-size:10px;letter-spacing:.35em;color:#deb78e}
.hero-mark{align-self:flex-start;position:relative;flex:0 0 69px;min-height:84px;background:linear-gradient(110deg,#6b222f,#a23f47 70%,#632531);box-shadow:0 5px 10px #0008,inset 0 0 0 2px #d59b7a;border-radius:2px 2px 12px 12px;color:#ffeed9;display:grid;place-items:center;font:900 46px/1 "Yu Mincho","Hiragino Mincho ProN",serif;text-shadow:0 1px 5px #291b1b}
.hero-mark:before{content:"";position:absolute;left:50%;bottom:-11px;width:20px;height:20px;background:#752c37;transform:translateX(-50%) rotate(45deg);z-index:-1}
.hero-copy{min-width:0;flex:1}
.hero-copy .eyebrow{font-size:11px;letter-spacing:.18em;color:#ffcf9b;text-shadow:0 2px 4px #000c}
.hero-copy h1{font-size:clamp(23px,3.4vw,36px);margin:6px 0 5px;color:#ffebcb;text-shadow:0 3px 6px #201119;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;letter-spacing:.07em}
.hero-copy .hint{color:#ffe0bd;font-size:12px;text-shadow:0 1px 5px #000a}
.bathhouse-hero .pill{align-self:flex-start;color:#60372d;font-weight:800;background:linear-gradient(#fff1ce,#e3bb79);border:2px solid #704a33;box-shadow:0 3px 0 #492b2c;padding:10px 12px;font-size:12px;border-radius:5px}
.stats,.safety,.details,.today-done,.listview,.done-wrap,.cal-unscheduled,.cal-timeline{border:1px solid #be936e;background-color:var(--paper);box-shadow:0 3px 0 #b9976535,0 7px 14px #623b2521}
.safety{border-radius:8px;border-left:5px solid #bb7154;background:linear-gradient(125deg,#fdf4df,#f8e8c8)}
.safety .btn{background:#954139;color:#fff4db;border:1px solid #6e332e}
.safety strong{color:#79503a}.safety p{color:#755c4b}
#saveStatus.ok{color:#4d7358}#saveStatus.warn{color:#ad4639}
.stats{position:relative;border-radius:8px;padding:12px 16px;background:linear-gradient(120deg,#fff7e7,#eed4aa)}
.stats:before{content:"本日の進みぐあい";flex:0 0 auto;font-family:"Yu Mincho",serif;font-size:13px;color:#8e5138;font-weight:800;letter-spacing:.05em}
.stat{color:#79543f}.stat strong{font-size:21px;color:#8f3b31;font-family:"Yu Mincho",serif}
.progress{border:1px solid #c19e71;background:#d7bd92;height:12px;border-radius:3px;box-shadow:inset 0 1px 2px #8c623b55}
.progress span{background:linear-gradient(90deg,#9d3b34,#c7664e,#ddac70);border-radius:2px}
.add{padding:11px;background:linear-gradient(180deg,#d5b58a,#e3cba6);border:1px solid #ba936d;border-radius:8px;box-shadow:0 3px 0 #9c6d5233}
.add input,.add select,.daily-add,.editing input,.editing textarea,.schedule-edit input,.project-edit select,.cal-date-label input,.exportbox textarea{background:#fff9ed;border:1px solid #bfa080;border-radius:5px;color:#4b342a}
.add input{padding:11px 12px}.add input::placeholder{color:#a28a71}
.btn{color:#754935;border-color:#b58d66;background:linear-gradient(180deg,#fff8eb,#f5e1c1);box-shadow:0 2px 0 #b8926b55;border-radius:5px;min-height:39px}
.btn.primary{background:linear-gradient(180deg,#bb5847,#8d3833);border-color:#79332e;color:#fff2de;text-shadow:0 1px 1px #592e28}
.btn.subtle{background:linear-gradient(180deg,#f8ead3,#e9cda3);color:#723d35}
.btn:hover:not(:disabled),.cal-day:hover,.tabs button:hover{filter:brightness(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d28c43;outline-offset:2px}
.bar{padding:7px 8px;border:1px solid #906445;border-radius:8px;background:linear-gradient(120deg,#653a32,#864b3c 48%,#60382f);box-shadow:0 3px 0 #4b292555}
.tabs{background:#4e302d;border:1px solid #b27955;border-radius:5px;padding:3px}
.tabs button{color:#eed1a4;border-radius:3px;font-family:"Yu Mincho",serif;font-size:13px;font-weight:900}
.tabs button.on{background:linear-gradient(#fff0d1,#dfb481);color:#6b352d;box-shadow:inset 0 0 0 1px #b37b52}
.bar .smallnote{color:#f3d8b7}
.board{gap:11px;grid-template-columns:repeat(5,minmax(206px,1fr));min-width:1090px}
.lane{--lane-ink:#a34b40;--lane-border:#c88b76;--lane-wash:#fae7d8;min-height:320px;border:1px solid var(--lane-border);background:linear-gradient(155deg,var(--lane-wash),#fff9e9 62%);border-radius:6px;padding:8px;box-shadow:inset 0 0 0 3px #fdf2dd,0 3px 0 #a8775742}
.lane:nth-child(2){--lane-ink:#56745b;--lane-border:#92a48a;--lane-wash:#edf2dc}
.lane:nth-child(3){--lane-ink:#6c6473;--lane-border:#aaa0ac;--lane-wash:#eee6ed}
.lane:nth-child(4){--lane-ink:#b65d56;--lane-border:#d9a198;--lane-wash:#fbe1dd}
.lane:nth-child(5){--lane-ink:#75638c;--lane-border:#b19dbf;--lane-wash:#ede5ef}
.board .lane[data-lane="care_today"]{background:linear-gradient(155deg,#fbe3de,#fff9e9 62%)}
.board .lane[data-lane="care_want"]{background:linear-gradient(155deg,#eee1ef,#fff9e9 62%)}
.lane-heading{position:relative;margin:-8px -8px 9px;padding:12px 10px 12px;background:linear-gradient(110deg,var(--lane-ink),color-mix(in srgb,var(--lane-ink) 83%,#2c2020));color:#fff3e0;border-bottom:3px double #efc38b;text-shadow:0 1px 1px #39241b66;gap:6px;min-height:58px}
.lane-heading:after{content:"✿";position:absolute;right:12px;bottom:-11px;color:#ffdfb8;font-size:14px;text-shadow:0 1px 2px #8b4b3c}
.lane-name{font-size:12px;line-height:1.4;font-family:"Yu Mincho",serif;letter-spacing:.01em}
.count{color:#fff1d9;font-weight:800;background:#ffffff29;border:1px solid #ffffff4a;padding:3px 6px;border-radius:20px;white-space:nowrap}
.lane.over{outline:3px dashed #c55b3e;background:#fbe1bb}
.task-card,.cal-card{background:linear-gradient(110deg,#fffdf5,#fff4df);border:1px solid #caad83;border-radius:4px;box-shadow:0 2px 0 #9d765b29;position:relative}
.task-card:after{content:"";position:absolute;inset:3px;border:1px solid #d8bc9729;border-radius:2px;pointer-events:none}
.task-card.active{border:2px solid #ae5144;box-shadow:0 0 0 2px #efcaa7}
.task-card.is-project{border-left:4px solid #a54139;background:linear-gradient(110deg,#fae2c9,#fff8e8)}
.project-children{border-color:#b9917a}
.drag-handle{color:#8e5b49;background:#f3dec3;border:1px solid #d9b897;border-radius:4px}
.card-main{color:var(--ink)}.card-title{font-size:12px;color:#4b332a}
.card-meta,.list-sub{color:#93775f}
.finish{border:2px solid #c09065;border-radius:5px;color:#8b4539;background:#fff7e5;font-weight:900}
.finish:hover{background:#e9efd9;border-color:#659368}
.fold-btn{color:#9d4137;border-color:#d3b58f;background:#fff6e3}
.empty{border:1px dashed #d0ab85;color:#988069;background:#fff7e99c}
.listview{border-radius:7px}
.list-section{background:linear-gradient(100deg,#965044,#bb7458);color:#fff4db;font-family:"Yu Mincho",serif;font-size:13px;border-bottom:2px solid #deb58b}
.list-row{border-top:1px dashed #dfcaaa;background:#fffaf0}
.list-row:nth-child(even){background:#fcf0dd}
.list-row.active,.list-row.project-row{background:#fae1c4}
.list-title{color:#503629}.list-status{background:#efe0c6;color:#785849}
.details{border:2px solid #bd9166;border-radius:8px;padding:15px;background:linear-gradient(145deg,#fff9ea,#f3e2c2)}
.details h2{font-family:"Yu Mincho",serif;font-size:20px;color:#913c35}
.details-top{padding-bottom:9px;border-bottom:1px solid #ceaa84}
.label{color:#875540;font-size:12px}
.project-edit,.schedule-edit{background:#f8e8d0;border-color:#d4b28b;border-radius:6px}
.stagebuttons button{color:#805742;background:#f6e5c9;border:1px solid #ceb08d;border-radius:5px}
.stagebuttons button.on{background:#f8d9b5;color:#8b3d32;border-color:#a4453a}
.recurrence{background:#f6e3c5;border:1px solid #c9a37c;border-radius:6px}
.nextbox{background:#f4e1c4;border-left:4px solid #aa5146;border-radius:4px}
.calendar{gap:12px}
.cal-toolbar{padding:9px;border:1px solid #c99e75;border-radius:7px;background:#f7e5c9}
.cal-week{gap:6px}
.cal-day{background:linear-gradient(175deg,#fff7e8,#efd8b5);border:1px solid #c9a47b;border-radius:5px;box-shadow:0 2px 0 #b48a653a;color:#674630}
.cal-day span{color:#846650}
.cal-day.on{background:linear-gradient(175deg,#bb5e4d,#954039);color:#ffefd1;border-color:#843b34}
.cal-day.on span{color:#ffdcaa}
.cal-day.today{font-weight:900}
.cal-unscheduled{background:linear-gradient(125deg,#f3ddbb,#fff7e7);border-radius:7px;border-left:4px solid #a64e42}
.cal-head{color:#7f4537}
.cal-pool{min-height:57px}.cal-card{padding:5px 7px}
.cal-timeline{background:#fff9ee;border-radius:7px}
.cal-slot,.cal-slot-time{background:#fff9ed;border-color:#e3ccaa}
.cal-slot.hour-bg{background:#f8ecd9}.cal-slot.is-current{box-shadow:inset 4px 0 #a54d3f}
.cal-slot.is-current .cal-slot-time{background:#f2d5aa;color:#9b4239}
.cal-slot.over{background:#f5dfbd;outline-color:#a54e42}
.today-done{border-radius:7px;background:#fff8e8;border-left:5px solid #70916b}
.today-done .btn,.done-wrap .btn{font-family:"Yu Mincho",serif;font-weight:800}
.done-wrap{border:1px solid #c8a37a;background:#f9edda;padding:12px;border-radius:7px;margin-top:12px}
.done-item{background:#fff6e6;border-color:#c8a47c;border-radius:4px}.done-item button{color:#a0453a}
.exportbox{background:#ead6b9;border:1px solid #c69c75;border-radius:5px}
.foot{background:#ecdbbf;border-top:2px solid #c7a781;padding:13px;border-radius:3px;color:#765842}
.helper{color:#88654d;padding:10px 4px}
.soot-icon{display:inline-block;position:absolute;right:18px;bottom:14px;width:25px;height:25px;background:#15141b;border-radius:50%;box-shadow:-15px 9px 0 -4px #1b1820,3px -5px 0 -3px #17141b;pointer-events:none;opacity:.94}
.soot-icon:before,.soot-icon:after{content:"";position:absolute;top:9px;width:6px;height:8px;background:#faf5e8;border-radius:50%}
.soot-icon:before{left:6px}.soot-icon:after{right:6px}
@media(min-width:940px){.board{grid-template-columns:repeat(5,minmax(202px,1fr));min-width:0}}
@media(max-width:700px){.app{padding:9px 8px 25px;border-left:0;border-right:0}.bathhouse-hero{min-height:162px;padding:17px 12px 21px;gap:10px;border-width:3px;background-position:61% center}.hero-mark{flex-basis:48px;min-height:64px;font-size:31px}.hero-copy h1{font-size:22px;letter-spacing:0}.hero-copy .eyebrow{font-size:9px}.hero-copy .hint{font-size:10px}.bathhouse-hero .pill{position:absolute;right:12px;top:12px;font-size:10px;max-width:94px;white-space:normal;padding:6px 8px}.hero-copy h1{font-size:21px;margin-top:17px}.hero-copy .eyebrow{max-width:170px;line-height:1.35}.stats{flex-wrap:wrap;gap:6px 10px}.stats:before{flex-basis:100%;font-size:11px}.stats .progress{min-width:100px}.add{padding:9px}.add input{flex-basis:100%}.bar{gap:5px}.tabs{width:100%}.tabs button{font-size:12px}.bar .smallnote{max-width:none;text-align:left}.board{min-width:1090px}.lane-heading{min-height:58px}.cal-toolbar .btn{min-height:38px}.detailgrid{grid-template-columns:minmax(0,1fr)}.soot-icon{right:12px;bottom:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}


/* ===== 湯屋の帳場 v0.8: immersive scenery, unchanged task interactions & layout ===== */
:root{--bg:#101b27;--paper:#fff6e7;--wood:#4e2929;--gold:#e2a866}
html{background:#101624}
body{
 background-color:#101724;
 background-image:linear-gradient(180deg,rgba(9,14,29,.27),rgba(9,14,29,.46) 55%,rgba(7,11,22,.7)),url("");
 background-size:cover,cover;
 background-repeat:no-repeat;
 background-position:center top,center top;
 background-attachment:fixed;
}
.app{
 position:relative;
 background:linear-gradient(180deg,rgba(14,24,41,.12),rgba(27,18,28,.26) 35%,rgba(24,19,31,.44) 100%);
 border-left:1px solid #ddad7255;
 border-right:1px solid #ddad7255;
 box-shadow:0 0 100px #060a1499;
}
.bathhouse-hero{
 min-height:284px;
 border:3px solid #aa714b;
 box-shadow:inset 0 0 0 2px #e2ad72,0 10px 28px #080d1bb0;
 background-color:#0c1925;
 background-image:linear-gradient(90deg,#0a1320f5 0%,#0b1425ed 17%,#111927a9 38%,#11182721 68%,#0c142818 100%),url("");
 background-size:cover,cover;
 background-position:center,center top;
 background-repeat:no-repeat;
 padding:21px 24px;
}
.bathhouse-hero:before{inset:8px;border-color:#f3cb8b99}
.bathhouse-hero:after{content:"♨  灯りのともる湯屋  ·  今宵の仕事帖";bottom:11px;color:#ffe4b4;text-shadow:0 2px 5px #030a12;letter-spacing:.21em}
.hero-copy{align-self:flex-start;padding-top:7px}
.hero-copy .eyebrow{font-size:11px;color:#f4c990;letter-spacing:.16em;text-shadow:0 2px 5px #070913}
.hero-copy h1{font-size:clamp(24px,3vw,37px);color:#ffebc7;text-shadow:0 3px 8px #050913,1px 1px 1px #381f25;max-width:560px}
.hero-copy .hint{color:#fbe1be;max-width:420px;text-shadow:0 2px 4px #07111b}
.hero-mark{background:linear-gradient(135deg,#882f40,#a6494c 63%,#642130);box-shadow:0 7px 15px #050710b0,inset 0 0 0 2px #f0c18d}
.bathhouse-hero .pill{z-index:1;background:linear-gradient(155deg,#fff2d6,#e9c18e);border-color:#91593a;box-shadow:0 4px 12px #050b1a88}
/* The photo remains visible around and between panels. Paper remains opaque enough for touch/reading. */
.safety,.stats,.add,.cal-toolbar,.done-wrap,.today-done,.details,.listview,.cal-unscheduled,.cal-timeline{
 backdrop-filter:blur(6px);
 -webkit-backdrop-filter:blur(6px);
 box-shadow:0 4px 14px #100e1f59;
}
.safety{background:linear-gradient(105deg,#fff3ddeb,#f7e3cbe5)}
.stats{background:linear-gradient(105deg,#fff8e8ee,#f3dbb5dc)}
.add{background:linear-gradient(105deg,#ead1a5db,#d6ad81cc)}
.bar{background:linear-gradient(120deg,#68372fe8,#80483fda 48%,#502c2be8);box-shadow:0 3px 12px #100a1888}
.lane{
 min-height:320px;
 background:linear-gradient(158deg,#fff5e7e8,#fff9ede0 64%);
 box-shadow:inset 0 0 0 2px #ffead8cb,0 6px 16px #110e1f4d;
 backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.lane:nth-child(1){background:linear-gradient(158deg,#fae0ceeb,#fff8e9de 64%)}
.lane:nth-child(2){background:linear-gradient(158deg,#e4eccaeb,#fff9e9de 64%)}
.lane:nth-child(3){background:linear-gradient(158deg,#e8dce9eb,#fff9e9de 64%)}
.lane:nth-child(4),.board .lane[data-lane="care_today"]{background:linear-gradient(158deg,#f9dad9eb,#fff8e9de 64%)}
.lane:nth-child(5),.board .lane[data-lane="care_want"]{background:linear-gradient(158deg,#e9dbf2eb,#fff9e9de 64%)}
.lane-heading{background:linear-gradient(110deg,var(--lane-ink),color-mix(in srgb,var(--lane-ink) 80%,#38252b));box-shadow:0 2px 8px #160e1e42}
.task-card,.cal-card{background:linear-gradient(120deg,#fffdf6f8,#fff2deed);box-shadow:0 3px 7px #1b0e1830}
.details{background:linear-gradient(145deg,#fff9ecf4,#f4e3c9ef)}
.cal-toolbar,.cal-unscheduled{background:linear-gradient(125deg,#f4dfc4f4,#fff5e2ef)}
.cal-timeline{background:#fff9eef0}
.today-done{background:#fff8e9f2}.done-wrap{background:#f9ead5ef}
.listview{background:#fff9eaf2}
.foot{background:#f3e4ccde}
/* Tiny lantern accents, entirely noninteractive */
.bathhouse-hero .soot-icon{bottom:13px}
@media(max-width:700px){
 body{background-attachment:scroll;background-position:center top,58% top}
 .app{padding:9px 8px 25px;border:0}
 .bathhouse-hero{min-height:242px;padding:15px 12px 27px;background-position:center,58% top;background-size:cover,auto 100%}
 .hero-copy{align-self:flex-start;padding-top:2px}
 .hero-copy h1{font-size:22px;max-width:205px;margin-top:24px}
 .hero-copy .hint{max-width:210px;font-size:10px}
 .hero-copy .eyebrow{max-width:190px;font-size:9px}
 .bathhouse-hero .pill{right:10px;top:10px;font-size:9px}
 .bathhouse-hero:after{letter-spacing:.06em;left:13px;right:35px;font-size:9px}
 .hero-mark{flex-basis:43px;min-height:62px;font-size:30px}
 .lane{backdrop-filter:none}
}
@media(prefers-reduced-motion:reduce){body{background-attachment:scroll}}

.bathhouse-hero .hero-figure{position:absolute;left:40%;bottom:5px;width:225px;height:174px;pointer-events:none;z-index:0;background:url("") center bottom/cover no-repeat;opacity:.90;mask-image:linear-gradient(to top,#000 65%,transparent 100%);-webkit-mask-image:linear-gradient(to top,#000 65%,transparent 100%);filter:drop-shadow(0 3px 5px #0a1423a0)}
.bathhouse-hero .hero-copy,.bathhouse-hero .hero-mark,.bathhouse-hero .pill{position:relative;z-index:1}
@media(max-width:700px){.bathhouse-hero .hero-figure{left:43%;bottom:3px;width:128px;height:124px;opacity:.78}.bathhouse-hero .hero-copy h1{font-size:20px;max-width:none;white-space:nowrap;letter-spacing:-.02em;margin-top:44px}}

.btn{background:#fff2d9;color:#5a342e;border:1px solid #b98b63;box-shadow:0 2px 5px #4c292019;border-radius:7px}.btn:hover{background:#ffe9c4}.btn.primary,.safety .btn{background:linear-gradient(#b95046,#87312e);border-color:#71332e;color:#fff5df;box-shadow:0 3px 7px #581c1c2e}.btn.primary:hover{background:#8f2d2b}
.bar{padding:7px 12px;background:rgba(49,29,41,.88);border-color:#a2745d;color:#ffe1b2}.tabs{background:transparent}.tabs button{color:#f1d8b9}.tabs button.on{color:#5a342e;background:linear-gradient(#fff2d8,#e6b881);box-shadow:0 1px 5px #0007}.bar .smallnote{color:#eed3ae}.helper{padding:10px 12px;margin-top:11px;background:rgba(250,231,199,.89);color:#725445}

.board{min-width:1150px;grid-template-columns:repeat(5,minmax(212px,1fr));gap:10px}
.lane,.board .lane[data-lane="care_today"],.board .lane[data-lane="care_want"]{min-height:430px;background:rgba(244,223,207,.25)!important;border:1px solid #e0b587!important;border-radius:11px;padding:0 9px 10px;overflow:hidden;backdrop-filter:none;box-shadow:inset 0 0 20px #f7e7dc22}
.lane:nth-child(1){background:rgba(249,220,208,.24)!important}.lane:nth-child(2){background:rgba(225,239,213,.20)!important}.lane:nth-child(3){background:rgba(226,219,231,.21)!important}.lane:nth-child(4){background:rgba(253,213,214,.24)!important}.lane:nth-child(5){background:rgba(230,210,245,.22)!important}
.lane-heading{margin:0 -9px 12px;padding:12px 12px 11px;min-height:52px;border-bottom:2px solid #e6bb81;color:#fff8ef;background:linear-gradient(90deg,#aa4f48,#8c3d3b);text-shadow:0 1px 3px #3b1623}.lane:nth-child(2) .lane-heading{background:linear-gradient(90deg,#5d7d62,#466a53)}.lane:nth-child(3) .lane-heading{background:linear-gradient(90deg,#777083,#5a5269)}.lane:nth-child(4) .lane-heading{background:linear-gradient(90deg,#b75f68,#9d4b55)}.lane:nth-child(5) .lane-heading{background:linear-gradient(90deg,#82698d,#625274)}.lane-name{font-size:14px}.count{color:#fff9ee;background:#ffffff2a;border:1px solid #ffffff50;border-radius:100px;padding:3px 9px;font-size:11px}
.task-card{background:rgba(255,248,232,.96);border:1px solid #c9a57d;box-shadow:0 3px 7px #54312432;border-radius:9px;min-height:62px}.task-card:hover{box-shadow:0 4px 12px #5631244e}.task-card.active{outline:2px solid #ad5247;border-color:#a64b40}.task-card.is-project{border-left:4px solid #a14e44;background:rgba(255,236,211,.98)}.card-title{font-size:12.5px;line-height:1.5;color:#4e332d}.card-meta{font-size:10px;color:#9b7961}.drag-handle{background:#f4debf;color:#905741;border:1px solid #dcb48b;border-radius:7px}.finish{border:2px solid #b88157;background:#fff8ea;color:#944136;font-size:15px;border-radius:7px;width:30px;height:30px}.empty{color:#806353;border-color:#bf9979;background:rgba(254,244,227,.35)}
.project-children{border-left-color:#ad8e68}.project-drop-note{background:#fff7e7a8}.project-edit,.nextbox,.schedule-edit{background:#f5e5cb}.recurrence{background:#f7e3ce}.stagebuttons button.on{background:#f2d2ad;color:#873c33;border-color:#a94b40}
.listview{overflow:hidden}.list-section{background:#8c5548;color:#fff1d4;font-size:12px}.list-row{background:rgba(255,250,239,.94)}.list-row.active{background:#f4dac0}.list-sub,.label{color:#8b6651}
.calendar{padding:14px;gap:11px;background:rgba(255,244,225,.9)}.cal-day{background:#fffaee}.cal-day.on{background:#f4dfbf;border-color:#a7433c}.cal-unscheduled{background:#f5e3cd}.cal-timeline{background:#fff6e5}.cal-slot{background:#fff7e8}.cal-slot.hour-bg{background:#f1e2c9}.cal-slot-time{background:#f3e1c5}.cal-card{background:#fff8eb}
.details{padding:20px}.details-top h2{font-size:16px}.today-done{margin-top:12px;padding:14px 16px}.today-done-row{font-size:12px}.today-done-row .log-stamp{margin-right:8px;color:#7b161f;font-size:10px;font-weight:850;border:1.5px solid #b6413a;padding:2px 6px 2px 4px;border-radius:999px;transform:rotate(-4deg);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:rgba(255,244,235,.92);box-shadow:0 2px 6px rgba(70,16,16,.10)}
.today-done-row .log-stamp img{width:16px;height:16px;object-fit:cover;border-radius:999px;border:1px solid #b6413a;display:block;background:#c33}
.done-wrap{padding:13px 16px;margin-top:10px}.foot{color:#ecd9bd;background:#241926a8;border:1px solid #a3786266;padding:12px 14px;border-radius:10px;margin-top:14px}
.stamp-switch{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#6e4b3c}.stamp-switch input{accent-color:#ad4740}
.reward-toast{position:fixed;inset:0;z-index:99999;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(29,11,14,.08),rgba(29,11,14,.18) 32%,rgba(29,11,14,0) 56%)}
.reward-toast[hidden]{display:none}.reward-seal{display:flex;align-items:center;gap:14px;color:#ad3736;font:900 24px/1.1 "Yu Mincho",serif;border:3px solid #c64943;padding:14px 18px;border-radius:14px;background:linear-gradient(180deg,rgba(255,246,236,.99),rgba(255,239,221,.97));box-shadow:0 16px 44px rgba(24,8,10,.28);transform:rotate(-3deg);animation:seal-in .34s cubic-bezier(.22,1.3,.35,1) both}
.reward-seal .stamp-face-wrap{flex:0 0 auto;width:86px;height:86px;border-radius:999px;border:3px solid #8f2730;box-shadow:0 3px 10px rgba(0,0,0,.18);background:#d73030;display:grid;place-items:center;overflow:hidden}
.reward-seal .stamp-face{width:100%;height:100%;display:block;object-fit:contain;object-position:center center;background:#d73030}
.reward-seal .stamp-text{display:flex;flex-direction:column;line-height:1.03}
.reward-seal .stamp-text small{font-size:11px;letter-spacing:.08em;color:#6a3940;font-weight:800}
@keyframes seal-in{0%{transform:scale(.45) rotate(-10deg);opacity:0}58%{transform:scale(1.08) rotate(-2deg);opacity:1}78%{transform:scale(.97) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
@media(prefers-reduced-motion:reduce){.reward-seal{animation:none}}

@media(max-width:580px){.add{padding:8px}.add input{flex-basis:100%;min-height:41px}.bar{align-items:center}.tabs{width:100%}.tabs button{flex:1;min-width:0;font-size:11px}.bar .smallnote{max-width:unset;text-align:left}.stats{gap:10px}.stat strong{font-size:16px}.stagebuttons{grid-template-columns:repeat(2,minmax(0,1fr))}.safety{gap:6px}.safety .btn{width:100%}.today-done-row{align-items:flex-start}.bathhouse-hero:after{left:15px;font-size:8px}.hero-copy h1{font-size:22px!important}.hero-copy .hint{line-height:1.35}}

/* v1.3: UI reduction and actual bathhouse background */
.bathhouse-hero{
  border:0!important;border-radius:0!important;outline:0!important;
  box-shadow:none!important;margin:0 0 12px!important;
  padding:35px clamp(12px,4vw,48px)!important;
  min-height:258px!important;display:flex;align-items:flex-start;
  background-size:cover!important;background-position:center 53%!important;
  background-color:#291923!important;
}
.bathhouse-hero::before,.bathhouse-hero::after{content:none!important;display:none!important}
.hero-copy{position:relative!important;z-index:2!important;flex:1!important;margin:0!important;padding:0!important;min-width:0}
.hero-copy h1,.bathhouse-hero h1{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif!important;
  font-size:clamp(30px,3.4vw,52px)!important;font-weight:800!important;
  color:#fff0d0!important;line-height:1.2!important;max-width:initial!important;
  margin:0!important;white-space:normal!important;
  text-shadow:0 3px 10px #1a0c11,0 0 22px #090406b0!important;
}
.hero-backup{position:relative!important;z-index:3!important;align-self:flex-start!important;flex:0 0 auto!important;
  min-width:166px;height:49px;padding:10px 17px!important;
  background:linear-gradient(#f6ddb2,#dbaf73)!important;color:#623822!important;
  border:2px solid #703c28!important;border-radius:7px!important;
  box-shadow:0 4px 0 #4d281d,0 6px 16px #160b1099!important;font-weight:800!important;font-size:14px!important;}
.hero-backup.needs-backup{border-color:#ae4636!important;box-shadow:0 4px 0 #6e2c26,0 0 0 2px #fff0d0aa!important}
.storage-warning{margin:7px 0 9px;background:#f9e2c1;color:#8c2d23;border:1px solid #aa4b3e;border-radius:7px;padding:10px 14px;font-weight:700;font-size:12px}
[hidden]{display:none!important}
/* Bathhouse wooden token/plaque styling: warm exposed grain and red-lacquer edges */
.stats,.add{
  position:relative!important;isolation:isolate;
  background:
   repeating-linear-gradient(92deg,transparent 0px,#89543210 1px,transparent 3px,transparent 17px),
   repeating-linear-gradient(0deg,transparent 0px,#6637191d 2px,transparent 4px,transparent 11px),
   linear-gradient(178deg,#f5d8a5 0%,#eabc78 40%,#daa061 64%,#f2cb91 100%)!important;
  border:3px solid #633b2b!important;border-radius:7px!important;
  box-shadow:inset 0 0 0 2px #f6e1b8,inset 0 6px 15px #e0b17e9c,
     inset 0 -6px 5px #7c4a2e60,0 6px 0 #3a241d,0 10px 22px #1f0c0b88!important;
  margin-bottom:17px!important;
  color:#4b2d20!important;
}
.stats:before,.add:before{content:"";position:absolute;left:7px;top:7px;bottom:7px;width:5px;
  border-radius:2px;background:linear-gradient(#b44335 0 22%,#392724 22% 34%,#ad4436 34% 75%,#38231f 75% 85%,#bc5440 85%);box-shadow:1px 0 #d9834e99;pointer-events:none}
.stats:after,.add:after{content:"";position:absolute;right:11px;top:10px;width:7px;height:7px;border-radius:50%;
 background:#65452f;box-shadow:inset 1px 1px 1px #1c1512,0 1px 0 #fce5bc;pointer-events:none}
.stats{min-height:66px!important;padding:12px 20px!important;gap:19px!important}
.stats .stat{font-size:12px!important;color:#593b2e!important;font-weight:700}
.stats .stat strong{color:#6c2e23!important;font-size:24px!important;font-variant-numeric:tabular-nums}
.stats .progress{background:#75493080!important;border:2px solid #72482b!important;height:15px!important;box-shadow:inset 0 2px 4px #20120c80!important}
.stats .progress span{background:linear-gradient(90deg,#ab4036,#dc7650,#a93931)!important}
.add{min-height:69px!important;padding:12px 16px 12px 22px!important;gap:8px!important}
.add input,.add select,.add .daily-add{
 background:#fff3d8f5!important;border:1px solid #a7714c!important;color:#52362a!important;
 box-shadow:inset 0 1px 4px #5a291b23!important;border-radius:6px!important;
}
.add input::placeholder{color:#896a54!important}
.add .btn{border-radius:6px!important;min-height:41px!important}
.add .btn.primary{background:linear-gradient(#ae4539,#792a26)!important;color:#fff5de!important}

<div class="app" id="app">
<header class="top bathhouse-hero"><div class="hero-copy"><h1>今日のやること手帖</h1></div><button class="btn hero-backup" id="quickExport" type="button">⬇ バックアップ</button></header>
<div class="hidden" aria-hidden="true"><span id="saveStatus"></span><span id="saveTip"></span></div><div id="storageWarning" class="storage-warning" hidden>⚠ この環境では自動保存できません。バックアップを保存してください。</div><div class="stats"><div class="stat"><strong id="todaycount">0</strong> 今日</div><div class="stat"><strong id="donecount">0</strong> 本日達成</div><div class="progress"><span id="progress"></span></div></div>
<form class="add" id="addform"><input id="newtitle" autocomplete="off" placeholder="今日やりたいことを追加…" aria-label="新規タスク"/><select id="newlane" aria-label="追加先"><option value="today">今日</option><option value="next">余裕があれば</option><option value="later">保留</option><option value="care_today">今日やるボディケア</option><option value="care_want">やりたいボディケア</option></select><label class="daily-add"><input type="checkbox" id="newDaily"/> 毎日</label><button class="btn primary" type="submit">＋ 仕事を追加</button><button class="btn" type="button" id="newProjectBtn">▣ 大きな仕事を作る</button></form>
<div class="bar"><nav class="tabs" aria-label="表示切り替え"><button id="showboard" class="on" type="button">五列の帳場</button><button id="showlist" type="button">仕事の一覧</button><button id="showcalendar" type="button">時間割</button></nav><span class="smallnote hidden" id="tip"></span></div>
<div class="board-scroll" id="boardScroll"><div id="board" class="board"></div></div><div id="listview" class="listview hidden"></div><section id="calendar" class="calendar hidden"><div class="cal-toolbar"><div class="flex"><button type="button" class="btn" id="calPrev">‹ 前日</button><button type="button" class="btn" id="calToday">今日</button><button type="button" class="btn" id="calNow">現在時刻へ</button><button type="button" class="btn" id="calNext">翌日 ›</button></div><label class="cal-date-label">日付 <input type="date" id="calDate"/></label></div><div class="cal-week" id="calWeek"></div><div class="cal-unscheduled" data-calendar-pool="true"><div class="cal-head"><strong>今日やる・今日やるボディケア（未配置）</strong><span id="unscheduledCount"></span></div><div id="calPool" class="cal-pool"></div></div><div class="cal-timeline" id="calTimeline" aria-label="時間割"></div></section>

<script>
(()=>{'use strict';
const KEY='dailyBoardManualV06',OLD_KEYS=['dailyBoardManualV05','dailyBoardManualV04','dailyBoardManualV03','dailyBoardManualV02'];
const defs=[{key:'today',label:'今日やる'},{key:'next',label:'余裕があれば'},{key:'later',label:'保留'},{key:'care_today',label:'今日やるボディケア'},{key:'care_want',label:'やりたいボディケア'}];
const samples=['Fatigue Atlasの追加候補を確認','Notion監査の未解決項目を整理','明日のタスクを1件選ぶ'];
let state={tasks:[],selected:null,view:'board',doneOpen:false,todayDoneOpen:false,doneHistory:[],lastCycle:null,calDate:null},drag=null;
let ready=false,localOK=false,dbOK=false,saveTime=0,db=null,dbTimer=null,calendarScrollMode=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const genId=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,9);
const find=id=>state.tasks.find(t=>t.id===id);
const laneMigration=s=>s==='care'?'care_want':s;
const validLane=s=>defs.some(x=>x.key===s);
const isProject=t=>t&&t.kind==='project';
const projectChildren=id=>state.tasks.filter(t=>t.parentId===id);
const childDisplay=t=>!t.parentId||!(find(t.parentId)&&isProject(find(t.parentId)));

const calendarEligible=t=>!isProject(t)&&(t.lane==='today'||t.lane==='care_today');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateFromKey=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
const shiftDay=(key,n)=>{const d=dateFromKey(key);d.setDate(d.getDate()+n);return ymd(d)};
const cycleKey=(now=new Date())=>{const d=new Date(now);if(d.getHours()<3)d.setDate(d.getDate()-1);return ymd(d)};
const currentCycle=()=>cycleKey(new Date());
const normal=t=>({
 id:String(t.id||genId()),title:String(t.title||'無題').slice(0,250),lane:validLane(laneMigration(t.lane))?laneMigration(t.lane):'today',done:!!t.done,
 phase:['idle','running','paused'].includes(t.phase)?t.phase:'idle',next:String(t.next||'').slice(0,2000),memo:String(t.memo||'').slice(0,3000),
 daily:!!t.daily,homeLane:validLane(laneMigration(t.homeLane))?laneMigration(t.homeLane):(validLane(laneMigration(t.lane))?laneMigration(t.lane):'today'),
 planDate:/^\d{4}-\d{2}-\d{2}$/.test(t.planDate||'')?t.planDate:null,
 planTime:/^([01]\d|2[0-3]):[0-5]\d$/.test(t.planTime||'')?t.planTime:null,
 kind:t.kind==='project'?'project':'task',parentId:typeof t.parentId==='string'&&t.parentId?t.parentId:null,
 collapsed:!!t.collapsed,doneAt:Number.isFinite(Number(t.doneAt))&&t.doneAt?Number(t.doneAt):null
});
function normalizeState(s){
 const tasks=s.tasks.slice(0,300).map(normal);
 const projects=new Map(tasks.filter(isProject).map(t=>[t.id,t]));
 for(const t of tasks){if(isProject(t)){t.parentId=null;t.daily=false;t.planDate=null;t.planTime=null} else if(!projects.has(t.parentId)||t.parentId===t.id){t.parentId=null}else{t.lane=projects.get(t.parentId).lane;}}
 const history=Array.isArray(s.doneHistory)?s.doneHistory.filter(h=>h&&typeof h.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(h.cycle||'')&&Number.isFinite(h.at)).slice(-2000).map(h=>({id:String(h.id||''),title:String(h.title).slice(0,250),cycle:h.cycle,at:h.at})):[];
 return {tasks,doneHistory:history,selected:s.selected??null,view:['board','list','calendar'].includes(s.view)?s.view:'board',doneOpen:!!s.doneOpen,todayDoneOpen:!!s.todayDoneOpen,lastCycle:/^\d{4}-\d{2}-\d{2}$/.test(s.lastCycle||'')?s.lastCycle:currentCycle(),calDate:/^\d{4}-\d{2}-\d{2}$/.test(s.calDate||'')?s.calDate:currentCycle()};
}
function saveBadge(){if(!ready)return;const good=localOK||dbOK;$('saveStatus').textContent=good?'✓ 端末内に自動保存 · バックアップ推奨':'⚠ この環境では自動保存できません';$('saveStatus').className=good?'ok':'warn';$('saveTip').textContent=good?'端末内の保存は保証されません。「バックアップ」でJSONファイルを保存できます。':'データが消える可能性があります。今すぐ「バックアップ」でファイルを保存してください。';const warn=$('storageWarning');if(warn)warn.hidden=true;const backup=$('quickExport');if(backup){backup.textContent=good?'⬇ バックアップ':'⚠ バックアップ';backup.title=good?'バックアップをダウンロード':'自動保存できない環境です。変更後はバックアップを保存してください。';backup.classList.toggle('needs-backup',!good)}}
function dbOpen(){return new Promise(resolve=>{try{if(!window.indexedDB)return resolve(null);const q=indexedDB.open('DailyTaskWorkspace',1);q.onupgradeneeded=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>resolve(null);q.onblocked=()=>resolve(null)}catch(e){resolve(null)}})}
function dbRead(key){return new Promise(resolve=>{if(!db)return resolve(null);try{const req=db.transaction('snapshots','readonly').objectStore('snapshots').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
function dbWrite(snap){return new Promise(resolve=>{if(!db)return resolve(false);try{const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').put(snap,'last_v06');tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false);tx.onabort=()=>resolve(false)}catch(e){resolve(false)}})}
function snapshot(){return {format:'daily-board-backup',version:10,updatedAt:saveTime||Date.now(),...state}}
function save(){if(!ready)return;saveTime=Date.now();const snap=snapshot();try{localStorage.setItem(KEY,JSON.stringify(snap));localOK=localStorage.getItem(KEY)!==null}catch(e){localOK=false}try{sessionStorage.setItem(KEY,JSON.stringify(snap))}catch(e){}if(db){clearTimeout(dbTimer);dbTimer=setTimeout(async()=>{dbOK=await dbWrite(snapshot());saveBadge()},140)}saveBadge()}
function rollover(){const cur=currentCycle();if(state.lastCycle===cur)return false;const old=state.lastCycle;state.lastCycle=cur;if(state.calDate===old)state.calDate=cur;let count=0;for(const t of state.tasks){t.planDate=null;t.planTime=null;if(t.daily){if(t.done)count++;t.done=false;t.doneAt=null;t.phase='idle';t.lane=t.homeLane;t.memo=''}}for(const t of state.tasks){if(t.parentId&&find(t.parentId)){const p=find(t.parentId);t.lane=p.lane;if(!t.done&&p.done){p.done=false;p.doneAt=null;}}}return count}
async function init(){const candidates=[];for(const storeName of ['localStorage','sessionStorage']){try{const store=window[storeName];for(const key of [KEY,...OLD_KEYS]){const v=JSON.parse(store.getItem(key)||'null');if(v&&Array.isArray(v.tasks))candidates.push({source:key===KEY?storeName:key,v,at:Number(v.updatedAt||0),ver:key===KEY?6:Number(v.version||3)})}}catch(e){}}
try{localStorage.setItem('__daily_board_storage_test','ok');localOK=localStorage.getItem('__daily_board_storage_test')==='ok';localStorage.removeItem('__daily_board_storage_test')}catch(e){localOK=false}
db=await dbOpen();for(const key of ['last_v06','last_v05','last']){const v=await dbRead(key);if(v&&Array.isArray(v.tasks))candidates.push({source:'IndexedDB '+key,v,at:Number(v.updatedAt||0),ver:key==='last_v06'?6:key==='last_v05'?5:Number(v.version||3)})}
candidates.sort((a,b)=>(b.ver||0)-(a.ver||0)||b.at-a.at||(b.v.tasks.length>0)-(a.v.tasks.length>0));
if(candidates.length){state=normalizeState(candidates[0].v);saveTime=candidates[0].at}
else{state.lastCycle=currentCycle();state.calDate=currentCycle()}
const reset=rollover();if(state.view==='calendar'){state.calDate=currentCycle();calendarScrollMode='now'}ready=true;render();saveBadge();if(reset)notice(`3:00更新：毎日タスク ${reset} 件が復活しました`);
}
let stampTimer=null;const stampCheckbox=$('stampEnabled');try{stampCheckbox.checked=localStorage.getItem('aburayaRewardStamp')!=='off'}catch(e){}stampCheckbox.addEventListener('change',()=>{try{localStorage.setItem('aburayaRewardStamp',stampCheckbox.checked?'on':'off')}catch(e){}});function showRewardStamp(){if(!stampCheckbox.checked)return;const node=$('rewardStamp');if(!node)return;clearTimeout(stampTimer);node.hidden=false;stampTimer=setTimeout(()=>{node.hidden=true},1850)}
const phaseText=t=>t.phase==='paused'?'⏸ 中断中':t.phase==='running'?'▶ 進行中':'未着手';
function notice(msg){$('toast').textContent=msg}
function updateStats(){const active=state.tasks.filter(t=>!t.done&&!isProject(t)&&calendarEligible(t));const completedToday=state.doneHistory.filter(h=>h.cycle===currentCycle()).length;const total=active.length+completedToday;$('todaycount').textContent=active.length;$('donecount').textContent=completedToday;$('progress').style.width=(total?100*completedToday/total:0)+'%';}
function cardHTML(t){const children=isProject(t)?projectChildren(t.id):[];
 return `<article class="task-card ${isProject(t)?'is-project':''} ${state.selected===t.id?'active':''}" data-id="${esc(t.id)}"><button class="drag-handle" data-handle="${esc(t.id)}" aria-label="${esc(t.title)}をドラッグして移動" title="ドラッグして移動">⠿</button>${isProject(t)?`<button class="fold-btn" data-toggle-project="${esc(t.id)}" aria-label="${t.collapsed?'展開':'折りたたみ'}" aria-expanded="${!t.collapsed}">${t.collapsed?'▸':'▾'}</button>`:''}<button class="card-main" data-select="${esc(t.id)}"><div class="card-title">${isProject(t)?'▣ ':''}${esc(t.title)}</div><div class="card-meta">${isProject(t)?`${children.filter(x=>x.done).length}/${children.length} 子タスク · ここにドラッグして追加`: `${t.daily?'<span class="daily-mark">↻ 毎日</span> · ':''}${phaseText(t)}${t.planTime?' · 🕒 '+esc(t.planTime):''}`}</div></button><button class="finish" data-done="${esc(t.id)}" aria-label="完了にする" title="完了にする">✓</button></article>`;
}
function boardItem(t){if(!isProject(t))return cardHTML(t);const children=projectChildren(t.id).filter(x=>!x.done);return `<div class="project-stack" data-project="${esc(t.id)}">${cardHTML(t)}${t.collapsed?'':`<div class="project-children">${children.map(cardHTML).join('')||'<div class="project-drop-note">既存のカードをここへドラッグ</div>'}</div>`}</div>`;}
function listItem(t,child=false){return `<div class="list-row ${child?'nested':''} ${isProject(t)?'project-row':''} ${state.selected===t.id?'active':''}">${isProject(t)?`<button class="fold-btn" data-toggle-project="${esc(t.id)}" aria-expanded="${!t.collapsed}">${t.collapsed?'▸':'▾'}</button>`:''}<button class="finish" data-done="${esc(t.id)}" aria-label="完了">✓</button><button class="list-title" data-select="${esc(t.id)}">${isProject(t)?'▣ ':''}${esc(t.title)}<div class="list-sub">${isProject(t)?`${projectChildren(t.id).filter(x=>x.done).length}/${projectChildren(t.id).length} 子タスク`: `${t.daily?'↻ 毎日 · ':''}${phaseText(t)}${t.planTime?' · '+esc(t.planTime):''}`}</div></button></div>${isProject(t)&&!t.collapsed?projectChildren(t.id).filter(x=>!x.done).map(x=>listItem(x,true)).join(''):''}`;}
function setDone(t,completed){if(!t||t.done===completed)return;if(completed&&isProject(t)&&projectChildren(t.id).some(x=>!x.done)){notice('プロジェクトは子タスクがすべて完了した後に完了できます');return}
 t.done=completed;t.phase='idle';const now=Date.now();if(completed){showRewardStamp();t.doneAt=now;state.doneHistory.push({id:t.id,title:t.title,at:now,cycle:currentCycle()});state.doneHistory=state.doneHistory.slice(-2000)}else{t.doneAt=null;const index=state.doneHistory.findLastIndex(h=>h.id===t.id&&h.cycle===currentCycle());if(index>=0)state.doneHistory.splice(index,1)}
 if(t.done&&state.selected===t.id)state.selected=null;render();}
function attachToProject(task,projectId){const project=find(projectId);if(!task||isProject(task)||!isProject(project)||task.id===projectId)return false;task.parentId=project.id;task.lane=project.lane;if(task.daily)task.homeLane=project.lane;project.collapsed=false;return true;}
function detachFromProject(task){if(task)task.parentId=null;}
function moveToLane(task,lane){if(!task||!validLane(lane))return;task.lane=lane;if(task.daily)task.homeLane=lane;if(task.parentId&&find(task.parentId)?.lane!==lane)detachFromProject(task);if(isProject(task)){for(const ch of projectChildren(task.id)){ch.lane=lane;if(ch.daily)ch.homeLane=lane;}}}
function autoSize(el){if(!el)return;el.style.height='auto';el.style.height=Math.min(Math.max(el.scrollHeight+2,52),500)+'px';}
function calCard(t){return `<div class="cal-card ${state.selected===t.id?'active':''}" data-id="${esc(t.id)}"><button class="drag-handle" data-handle="${esc(t.id)}" aria-label="時間帯へ移動">⠿</button><button data-select="${esc(t.id)}">${esc(t.title)}${t.daily?' <span class="daily-mark">↻</span>':''}</button></div>`}
function isScheduledHere(t){return !isProject(t)&&!t.done&&!!t.planTime&&t.planDate===state.calDate}
function clockAt(slot){let min=(180+slot*30)%(24*60);return pad(Math.floor(min/60))+':'+pad(min%60)}
function offsetFor(time){if(!time)return -1;const p=time.split(':').map(Number);const min=p[0]*60+p[1];return (min+1440-180)%1440}
function currentSlotIndex(){const n=new Date(),minutes=n.getHours()*60+n.getMinutes();return Math.floor(((minutes+1440-180)%1440)/30)}
function scrollCalendarDefault(mode='now'){const timeline=$('calTimeline');if(mode==='start'||state.calDate!==currentCycle()){timeline.scrollTop=0;return}const slots=timeline.querySelectorAll('.cal-slot');const target=slots[currentSlotIndex()];if(target){const top=target.getBoundingClientRect().top-timeline.getBoundingClientRect().top+timeline.scrollTop;timeline.scrollTop=Math.max(0,top-1)}}
function renderCalendar(){const date=state.calDate;const timeline=$('calTimeline'),beforeScroll=timeline.scrollTop;
$('calDate').value=date;const center=dateFromKey(date),weekday=center.getDay(),start=shiftDay(date,-((weekday+6)%7));
$('calWeek').innerHTML=Array.from({length:7},(_,i)=>{const k=shiftDay(start,i);const d=dateFromKey(k);const label=['日','月','火','水','木','金','土'][d.getDay()];return `<button type="button" class="cal-day ${k===date?'on':''} ${k===currentCycle()?'today':''}" data-cal-day="${k}"><span>${label}</span>${d.getDate()}</button>`}).join('');
const pool=state.tasks.filter(t=>!t.done&&calendarEligible(t)&&!t.planTime);$('unscheduledCount').textContent=pool.length+'件';$('calPool').innerHTML=pool.length?pool.map(calCard).join(''):'<span class="cal-empty">今日の未配置タスクはありません。時間枠からここへ戻すこともできます。</span>';
$('calTimeline').innerHTML=Array.from({length:48},(_,i)=>{const clock=clockAt(i),isCurrent=date===currentCycle()&&i===currentSlotIndex(),scheduled=state.tasks.filter(t=>isScheduledHere(t)&&offsetFor(t.planTime)>=i*30&&offsetFor(t.planTime)<(i+1)*30);return `<div class="cal-slot ${i%2===0?'onhour hour-bg':''} ${isCurrent?'is-current':''}" data-slot="${clock}"><div class="cal-slot-time">${clock}</div><div class="cal-slot-body">${scheduled.map(calCard).join('')}</div></div>`}).join('')+'<div class="cal-tail" aria-hidden="true"></div>';if(calendarScrollMode){scrollCalendarDefault(calendarScrollMode);calendarScrollMode=null}else timeline.scrollTop=beforeScroll;}
function render(){updateStats();$('board').innerHTML=defs.map(d=>{const arr=state.tasks.filter(t=>!t.done&&t.lane===d.key);const roots=arr.filter(childDisplay);return `<section class="lane" data-lane="${d.key}"><div class="lane-heading"><span class="lane-name">${d.label}</span><span class="count">${arr.length}件</span></div><div class="lane-body">${roots.length?roots.map(boardItem).join(''):'<div class="empty">ここへドロップ</div>'}</div></section>`}).join('');
$('listview').innerHTML=defs.map(d=>{const arr=state.tasks.filter(t=>!t.done&&t.lane===d.key);const roots=arr.filter(childDisplay);return `<div class="list-section">${d.label} · ${arr.length}</div>${roots.map(t=>listItem(t)).join('')}`}).join('');

$('todayDoneList').classList.toggle('hidden',!state.todayDoneOpen);
$('toggleTodayDone').setAttribute('aria-expanded',String(state.todayDoneOpen));
$('toggleTodayDone').innerHTML=`今日やったこと ${state.todayDoneOpen?'▴':'▾'} <span id="todayDoneCount">${logs.length}件</span>`;
$('doneList').innerHTML=state.tasks.filter(t=>t.done).map(t=>`<div class="done-item">✓ ${esc(t.title)} ${t.daily?'(毎日)':''} <button data-restore="${esc(t.id)}">戻す</button></div>`).join('')||'<span class="smallnote">現在完了になっているタスクはありません</span>';
$('doneList').classList.toggle('hidden',!state.doneOpen);
$('toggleDone').textContent=state.doneOpen?'全体の完了済みタスクを閉じる ▴':'全体の完了済みタスクを見る ▾';
renderDetail();save()}
function renderDetail(){const t=find(state.selected);$('detail').classList.toggle('hidden',!t);if(!t)return;
$('editTitle').value=t.title;$('editNext').value=t.next;$('editMemo').value=t.memo;
$('editDaily').checked=t.daily;$('editDaily').disabled=isProject(t);$('editPlanDate').value=t.planDate||state.calDate;$('editPlanDate').disabled=isProject(t);$('editPlanTime').value=t.planTime||'';$('editPlanTime').disabled=isProject(t);$('clearPlan').disabled=isProject(t);
$('projectEdit').classList.toggle('hidden',!isProject(t));$('taskProjectEdit').classList.toggle('hidden',isProject(t));
if(isProject(t)){
 const available=state.tasks.filter(x=>!isProject(x)&&x.parentId!==t.id);
 $('projectPick').innerHTML='<option value="">追加するカードを選ぶ</option>'+available.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');
 $('projectAddChild').disabled=!available.length;
 $('projectChildren').innerHTML=projectChildren(t.id).map(x=>`<div class="project-member"><span>${x.done?'✓ ':''}${esc(x.title)}</span><button type="button" class="btn" data-unlink="${esc(x.id)}">外す</button></div>`).join('')||'<span class="smallnote">子タスクがまだありません</span>';
 }else{
 $('parentProject').innerHTML='<option value="">所属なし（通常カード）</option>'+state.tasks.filter(x=>isProject(x)&&!x.done).map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');$('parentProject').value=t.parentId||'';
 }
for(const el of [$('editNext'),$('editMemo')])autoSize(el);
document.querySelectorAll('[data-stage]').forEach(b=>{b.classList.toggle('on',b.dataset.stage===t.lane);b.disabled=t.done});$('phaseLabel').textContent=phaseText(t);$('phaseButtons').innerHTML=(t.done?'':t.phase==='idle'?'<button class="btn primary" data-phase="running">▶ 着手する</button>':t.phase==='running'?'<button class="btn" data-phase="paused">⏸ 中断地点を保存</button>':'<button class="btn primary" data-phase="running">▶ ここから再開</button>')+'<button class="btn" data-phase="idle">作業状態をリセット</button>';
$('complete').textContent=t.done?'↩ 未完了に戻す':'✓ 完了にする';
}
function setSelected(id){state.selected=id;render();$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function add(title,lane='today',daily=false,kind='task'){const t=normal({id:genId(),title,lane,homeLane:lane,daily:kind==='project'?false:daily,kind,phase:'idle',done:false});state.tasks.push(t);state.selected=t.id;render()}
$('addform').addEventListener('submit',e=>{e.preventDefault();const v=$('newtitle').value.trim();if(!v)return;add(v,$('newlane').value,$('newDaily').checked);$('newtitle').value='';$('newtitle').focus()});
$('newProjectBtn').onclick=()=>{const v=$('newtitle').value.trim();if(!v){$('newtitle').focus();$('newtitle').placeholder='プロジェクト名を入力して作成';return}add(v,$('newlane').value,false,'project');$('newtitle').value='';$('newDaily').checked=false};
function setView(view){const entering=view==='calendar'&&state.view!=='calendar';state.view=view;if(entering){state.calDate=currentCycle();calendarScrollMode='now'}render()}
$('showboard').onclick=()=>setView('board');$('showlist').onclick=()=>setView('list');$('showcalendar').onclick=()=>setView('calendar');
$('calPrev').onclick=()=>{state.calDate=shiftDay(state.calDate,-1);calendarScrollMode='start';render()};$('calNext').onclick=()=>{state.calDate=shiftDay(state.calDate,1);calendarScrollMode='start';render()};$('calToday').onclick=()=>{state.calDate=currentCycle();calendarScrollMode='now';render()};$('calNow').onclick=()=>{state.calDate=currentCycle();calendarScrollMode='now';render()};$('calDate').onchange=e=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){state.calDate=e.target.value;calendarScrollMode='start';render()}};
$('closeDetail').onclick=()=>{state.selected=null;render()};
$('editTitle').addEventListener('input',e=>{const t=find(state.selected);if(t){t.title=e.target.value;save()}});$('editTitle').addEventListener('change',render);
$('editNext').addEventListener('input',e=>{const t=find(state.selected);if(t){t.next=e.target.value;autoSize(e.target);save()}});
$('editMemo').addEventListener('input',e=>{const t=find(state.selected);if(t){t.memo=e.target.value;autoSize(e.target);save()}});
$('projectAddChild').onclick=()=>{const p=find(state.selected),child=find($('projectPick').value);if(p&&child&&attachToProject(child,p.id))render()};
$('parentProject').onchange=e=>{const task=find(state.selected);if(!task||isProject(task))return;if(e.target.value){attachToProject(task,e.target.value)}else detachFromProject(task);render()};
$('editDaily').onchange=e=>{const t=find(state.selected);if(!t)return;t.daily=e.target.checked;if(t.daily)t.homeLane=t.lane;if(t.planTime&&!t.planDate)t.planDate=state.calDate;render()};
$('editPlanDate').onchange=e=>{const t=find(state.selected);if(t&&!isProject(t)){t.planDate=e.target.value||null;render()}};
$('editPlanTime').onchange=e=>{const t=find(state.selected);if(t){t.planTime=e.target.value||null;if(t.planTime&&!t.planDate)t.planDate=state.calDate;render()}};
$('clearPlan').onclick=()=>{const t=find(state.selected);if(t){t.planTime=null;t.planDate=null;render()}};
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;const {select,done,restore,stage,phase,calDay,toggleProject,unlink}=target.dataset;
if(toggleProject){const p=find(toggleProject);if(p){p.collapsed=!p.collapsed;render()}return}
if(unlink){const child=find(unlink);if(child){detachFromProject(child);render()}return}
